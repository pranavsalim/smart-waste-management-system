
name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/smart-waste-management-system
            git pull origin main
            sudo docker build -t smart-waste-app .
            sudo docker stop smart-waste-container || true
            sudo docker rm smart-waste-container || true
            sudo docker run -d \
              --name smart-waste-container \
              --restart unless-stopped \
              -p 80:10000 \
              -v waste_data:/app/instance \
              smart-waste-app
